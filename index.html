o h1{font-size:27px;line-height:1.32;margin:7px 0 9px}.hero p{margin:0;color:#766b75;max-width:620px}.heroIcon{font-size:65px;line-height:1}.btn{border:1px solid var(--line);border-radius:14px;padding:11px 16px;background:white;color:var(--ink);font-weight:700;transition:.15s}.btn:hover{transform:translateY(-1px)}.btn.primary{background:var(--pink);color:white;border-color:var(--pink)}.btn.purple{background:var(--violet);color:white;border-color:var(--violet)}.btn.ghost{background:transparent}.btn.small{font-size:12px;padding:7px 10px;border-radius:10px}.btn.danger{color:#a94d63;border-color:#edc4d1}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.spread{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}.stat{background:var(--paper);border:1px solid var(--line);border-radius:19px;padding:15px 18px}.stat strong{font-size:25px;display:block;font-weight:750;line-height:1.4}.stat span{color:var(--sub);font-size:12px}.card{border-radius:23px;background:var(--paper);border:1px solid var(--line);padding:23px;box-shadow:0 5px 20px #7a4e6610;margin-bottom:17px}.card h2{font-size:18px;margin:0 0 13px}.card h3{font-size:15px;margin:0 0 10px}.muted{color:var(--sub)}.tiny{font-size:12px}.line{height:1px;background:var(--line);margin:18px 0}.empty{padding:55px 25px;text-align:center}.empty .emoji{font-size:49px}.empty h3{font-size:20px;margin:7px}.empty p{color:var(--sub)}.list{display:grid;gap:10px}.item{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:15px;background:#fff;border:1px solid var(--line);border-radius:17px}.item-main{min-width:0;flex:1}.item-title{font-weight:800;overflow-wrap:anywhere}.item-meta{font-size:12px;color:var(--sub);margin-top:3px}.chip{padding:3px 9px;display:inline-flex;align-items:center;gap:3px;font-size:11px;background:#f7f2f5;color:#7b6d7c;border-radius:20px}.chip.good{background:#e8f7ee;color:#2d8067}.chip.warn{background:#fff3e3;color:#a5742d}.chip.bad{background:#ffe9ef;color:#bd5571}.chip.purple{background:#f0ecfa;color:#7461a0}.score{font-weight:800;font-size:21px;color:var(--violet)}.stepper{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:19px 0}.step{border-radius:14px;background:#f7f0f4;padding:9px 6px;text-align:center;font-size:12px;color:#9d8d9c}.step.active{background:var(--violet);color:white;font-weight:750}.step.done{background:#e7f3ed;color:var(--mint)}.wizard{display:grid;grid-template-columns:minmax(0,1fr) 275px;gap:18px}.guide{position:sticky;top:14px;align-self:start}.hint{background:#f6f1fa;border-radius:16px;padding:15px;color:#74688a;font-size:13px}.field{margin-bottom:17px}.field label,.field .label{display:block;font-size:13px;font-weight:760;margin-bottom:7px}.field .help{color:var(--sub);font-size:12px;margin-top:5px}.field input,.field textarea,.field select{width:100%;border:1px solid #e7dce4;background:#fff;border-radius:12px;padding:11px 13px;color:var(--ink);outline:none;min-height:44px}.field textarea{min-height:96px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:#bd9ad0;box-shadow:0 0 0 3px #ebe1f4}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:13px}.choices{display:flex;gap:7px;flex-wrap:wrap}.choice{border:1px solid #eadde5;background:white;border-radius:12px;padding:9px 12px;font-size:12px;color:#746978}.choice.selected{background:#fce9ef;border-color:#e899b0;color:#ad476b;font-weight:750}.choice.positive.selected{background:#e6f5ec;border-color:#75b9a1;color:#287661}.choice.negative.selected{background:#ffebee;border-color:#e3a1a8;color:#b34860}.meter{height:9px;background:#f2eaf0;border-radius:30px;overflow:hidden;margin:9px 0}.meter span{display:block;height:100%;background:linear-gradient(90deg,#b8a7d9,#e985a3);border-radius:inherit;transition:width .2s}.metric{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px dashed #f0e6eb}.metric:last-child{border:0}.metric .m-title{font-weight:750;font-size:14px}.metric .m-weight{color:var(--sub);font-size:11px}.rating{display:flex;gap:5px}.rating button{width:38px;height:36px;border:1px solid #eadfe5;background:white;border-radius:9px;font-weight:700;color:#817380}.rating button.chosen{background:var(--violet);border-color:var(--violet);color:white}.rating button.neg.chosen{background:#c86b82;border-color:#c86b82}.rating button.pos.chosen{background:var(--mint);border-color:var(--mint)}.resultBox{background:linear-gradient(130deg,#f6eefa,#fff0f2);padding:20px;border-radius:20px}.resultNum{font-size:37px;font-weight:800;line-height:1.1;color:var(--violet)}.actions{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-top:20px}.alert{border-radius:12px;padding:10px 13px;background:#fff4df;color:#92612d;font-size:13px;margin:10px 0}.alert.error{background:#fdebf0;color:#a34665}.alert.ok{background:#eaf5ee;color:#347965}.barbox{background:#faf5f9;border-radius:17px;padding:15px}.smallcaps{letter-spacing:.12em;text-transform:uppercase;font-size:10px;color:var(--sub);font-weight:800}.budgetnum{font-size:25px;font-weight:800}.summary-list{padding:0;margin:0;list-style:none}.summary-list li{padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}.summary-list li:last-child{border:0}.mark{font-size:12px;color:var(--sub)}.stickyBottom{display:none}.footer{padding:24px 0;color:#a18d98;font-size:12px;text-align:center}.collapse{margin-top:12px}.tag{display:inline-block;background:#f6f0f3;border-radius:7px;font-size:11px;color:#8d7388;padding:4px 7px}.switchline{display:flex;align-items:center;gap:9px;font-size:13px}.switchline input{accent-color:var(--pink);width:18px;height:18px}.strong{font-weight:750}.hide{display:none!important}@media(max-width:800px){.wizard{grid-template-columns:1fr}.guide{position:static;order:2}.stats{grid-template-columns:repeat(2,1fr)}.heroIcon{display:none}}@media(max-width:580px){.shell{padding:13px 13px 108px}.brand strong{font-size:20px}.head{padding:10px 2px 14px}.pill{font-size:10px}.logo{width:44px;height:44px;border-radius:14px}.tabs{gap:2px;background:#fffafc;border:1px solid var(--line);border-radius:17px;padding:4px;display:grid;grid-template-columns:repeat(4,1fr)}.tabs button{padding:8px 3px;font-size:12px;border-radius:13px}.hero{padding:21px;display:block;border-radius:21px}.hero h1{font-size:22px}.hero p{font-size:13px}.card{padding:17px;border-radius:20px}.twocol{grid-template-columns:1fr}.item{align-items:flex-start}.item .row{justify-content:flex-end}.metric{display:block}.rating{margin-top:10px}.rating button{flex:1}.step{font-size:10px;padding:9px 2px}.stickyBottom{display:block;position:fixed;bottom:0;left:0;right:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:#fffefaed;backdrop-filter:blur(16px);border-top:1px solid var(--line);z-index:10}.stickyBottom .row>*{flex:1}.actions{display:none}}

.rj-import-line{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin:12px 0}
.rj-import-line .field{margin:0;flex:1 1 210px}
.rj-import-line .btn{min-height:44px}
.rj-preview{display:flex;gap:13px;align-items:start;background:#fff8fa;border:1px solid var(--line);padding:14px;border-radius:17px;margin:12px 0 18px}
.rj-cover{max-width:32%;width:108px;max-height:175px;object-fit:contain;border-radius:9px}
.rj-info{flex:1;min-width:0;overflow-wrap:anywhere;font-size:13px}
.rj-info>div{margin:4px 0}.rj-info summary{cursor:pointer;color:var(--violet)}
.rj-info details p{max-height:250px;overflow:auto;white-space:pre-line}
@media(max-width:580px){.rj-cover{width:85px}.rj-preview{gap:9px}}

<body><div class="shell" id="app"></div><div class="stickyBottom" id="mobileActions"></div>
<script>
(function(){
'use strict';
const KEY='otome-audio-picker-v1';
const METRICS=[
 ['art','BK与标题',5,'第一印象、视觉和标题吸引力'],
 ['cv','CV吸引力',10,'对声优本人的期待（与本作表现分开）'],
 ['story','剧情与人设',20,'题材、角色和关系设定'],
 ['daily','日常试听',25,'声线、自然度、演技和角色感'],
 ['intimate','亲密试听',25,'亲密部分的表现、节奏与自然度'],
 ['sound','音频制作',10,'收音、SE、空间感和沉浸度'],
 ['structure','内容结构',5,'时长、音轨与期待内容占比']
];
const TIMING=[
 ['cost','实付价格',40,'当前价格与自己的心理价位'],
 ['sale','折扣力度',30,'是否属于值得入手的折扣'],
 ['history','历史价格',20,'是否接近史低、是否常年打折'],
 ['edition','版本与优惠',10,'中日版本、券、其他组合优惠']
];
const DEFAULT={version:1,profile:{usual:15,exception:20,cheap:10,minMinutes:40,maxDiscount:2,budget:106.5,limit:15},entries:[],active:null,step:0,tab:'home'};
let db=load();
const DL_WORKER='https://dlsite-rj-import.shuiyingsheng.workers.dev/';
let rjFetch={id:'',state:'idle',message:''};
function cleanRJ(value){
 const s=String(value||'').trim().toUpperCase(),m=s.match(/(RJ|BJ)\s*(\d{4,12})/);
 return m?m[1]+m[2]:/^\d{4,12}$/.test(s)?'RJ'+s:'';
}
function firstName(...values){
 for(const v of values){
  if(Array.isArray(v)){const t=v.map(x=>firstName(x)).filter(Boolean).join(' / ');if(t)return t;}
  else if(v&&typeof v==='object'){const t=firstName(v.name,v.work_name,v.title,v.value,v.name_ja);if(t)return t;}
  else if(v!==null&&v!==undefined&&String(v).trim())return String(v).trim();
 }
 return '';
}
function parseMins(value){
 const s=String(value||'').trim();let m;
 if((m=s.match(/^(\d{1,3}):(\d{2}):(\d{2})$/)))return String(Math.ceil(+m[1]*60 + +m[2]+ +m[3]/60));
 const h=s.match(/(\d+)\s*(?:時間|小时|小時|hours?|hrs?)/i),min=s.match(/(\d+)\s*(?:分(?:钟|鐘)?|minutes?|mins?)/i);
 if(h||min)return String(+(h?h[1]:0)*60 + +(min?min[1]:0));
 if(/^\d{2,3}$/.test(s)&&+s<=600)return s;
 return '';
}
function safeCover(input){
 const v=firstName(input&&typeof input==='object'?(input.url||input.src):input);
 const u=v.startsWith('//')?'https:'+v:v;
 return /^https:\/\/[^\s<>"']+$/i.test(u)?u:'';
}
function priceYen(v){
 const s=firstName(v).replace(/[¥￥,\s]/g,'');
 return /^\d{1,7}$/.test(s)?s:'';
}
function decodeSynopsis(v){
 return firstName(v).replace(/<br\s*\/?>/gi,'\n').replace(/<[^>]*>/g,' ')
 .replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/[ \t]{2,}/g,' ').trim().slice(0,1200);
}
function parseDLProduct(raw,workno){
 let p=Array.isArray(raw)?raw[0]:raw;
 if(p&&p.work&&typeof p.work==='object')p=p.work;
 else if(p&&p.product&&typeof p.product==='object')p=p.product;
 else if(p&&typeof p==='object'&&!p.work_name&&!p.title){
  const key=Object.keys(p).find(k=>p[k]&&typeof p[k]==='object');
  if(key)p=p[key];
 }
 if(!p||typeof p!=='object')throw Error('没有找到作品信息');
 const returned=cleanRJ(firstName(p.workno,p.product_id,p.id));
 if(returned&&returned!==workno)throw Error('接口返回了其他RJ号的作品');
 const c=p.creators||p.creaters||p.maker||{};
 const d={
  title:firstName(p.work_name,p.title,p.name),
  cv:firstName(c.voice_by,c.voice,c.cv,c.cast,p.voice_by,p.voice,p.cv),
  circle:firstName(p.maker_name,p.circle,p.maker&&p.maker.name,p.brand&&p.brand.name),
  minutes:parseMins(firstName(p.duration,p.play_time,p.playtime,p.total_time,p.voice_length)),
  genres:firstName(p.genres,p.genre,p.tags),
  cover:safeCover(p.image_main&&p.image_main.url?p.image_main.url:p.image_main)||safeCover(p.images&&p.images.main)||safeCover(p.image&&p.image.main),
  synopsis:decodeSynopsis(p.description||p.work_description||p.introduction||p.intro||''),
  yen:priceYen(p.price||p.sales_price||p.price_str||p.work_price),
  officialYen:priceYen(p.official_price||p.regular_price)
 };
 if(!d.title&&!d.cv&&!d.circle)throw Error('接口没有返回可识别的作品信息');
 return d;
}
async function fetchRJ(it){
 const workno=cleanRJ(it.rj);
 if(!workno){rjFetch={id:it.id,state:'error',message:'请填写有效的 RJ 号，例如 RJ123456'};render();return;}
 if(rjFetch.state==='loading')return;
 const id=it.id,controller=new AbortController();
 const timeout=setTimeout(()=>controller.abort(),15000);
 it.rj=workno;
 rjFetch={id,state:'loading',message:'正在从 DLsite 获取作品资料…'};save();render();
 try{
  const url=new URL(DL_WORKER);url.searchParams.set('workno',workno);
  const res=await fetch(url.toString(),{method:'GET',cache:'no-store',credentials:'omit',signal:controller.signal});
  if(!res.ok)throw Error('HTTP '+res.status);
  const data=parseDLProduct(await res.json(),workno);
  const target=db.entries.find(x=>x.id===id);
  if(!target)return;
  for(const key of ['title','cv','minutes'])if(!target[key]&&data[key])target[key]=data[key];
  target.circle=data.circle||target.circle||'';
  target.coverUrl=data.cover||target.coverUrl||'';
  target.genres=data.genres||target.genres||'';
  target.synopsis=data.synopsis||target.synopsis||'';
  target.dlsiteYen=data.yen;
  target.dlsiteOfficialYen=data.officialYen;
  target.importedAt=Date.now();
  save();
  rjFetch={id,state:'success',message:'导入成功！已填入可识别的资料；已有手动内容保持不变。'};
 }catch(err){
  rjFetch={id,state:'error',message:err.name==='AbortError'?'查询超时，请重试':'导入失败：'+String(err.message||err)+'；仍可手动填写'};
 }finally{clearTimeout(timeout);render();}
}
function rjPreview(it){
 const cover=safeCover(it.coverUrl),state=rjFetch.id===it.id?rjFetch:null;
 let result=state&&state.state!=='idle'?'<div role="status" aria-live="polite" class="alert '+(state.state==='error'?'error':state.state==='success'?'ok':'')+'">'+e(state.message)+'</div>':'';
 if(cover||it.circle||it.genres||it.synopsis||it.dlsiteYen){
  result+='<div class="rj-preview">'+(cover?'<img class="rj-cover" src="'+e(cover)+'" alt="作品封面" loading="lazy" referrerpolicy="no-referrer">':'')+
  '<div class="rj-info">'+(it.circle?'<div><b>社团：</b>'+e(it.circle)+'</div>':'')+
  (it.genres?'<div><b>标签：</b>'+e(it.genres)+'</div>':'')+
  (it.dlsiteYen?'<div><b>DLsite 日元现价：</b>¥'+e(it.dlsiteYen)+'</div>':'')+
  (it.dlsiteOfficialYen?'<div><b>DLsite 日元原价：</b>¥'+e(it.dlsiteOfficialYen)+'</div>':'')+
  (it.synopsis?'<details><summary>查看官方简介</summary><p>'+e(it.synopsis)+'</p></details>':'')+
  '<div class="tiny muted">上面是DLsite资料，人民币实际付款价请按本次活动填写。</div></div></div>';
 }
 return result;
}

function load(){try{const raw=JSON.parse(localStorage.getItem(KEY)||'null');if(raw&&Array.isArray(raw.entries)&&raw.profile)return Object.assign({},DEFAULT,raw,{profile:Object.assign({},DEFAULT.profile,raw.profile)});}catch(e){}return JSON.parse(JSON.stringify(DEFAULT));}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));document.querySelectorAll('[data-save-state]').forEach(x=>x.textContent='✓ 已自动保存');}catch(e){alert('浏览器本地存储失败，请尽快导出备份。');}}
function e(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function n(v){const x=Number(v);return Number.isFinite(x)?x:0;}
function yuan(v){return '¥'+n(v).toFixed(2).replace(/\.00$/,'');}
function newId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function entry(){return db.entries.find(x=>x.id===db.active);}
function newEntry(){const it={id:newId(),created:Date.now(),title:'',rj:'',cv:'',price:'',original:'',first:'unsure',artNote:'',exception:false,minutes:'',storyNote:'',expected:'',red:'unknown',redNote:'',trackNote:'',bkIncluded:'unknown',dailyCheck:'unknown',intimateCheck:'unknown',rod:'unknown',audioNote:'',rating:{},timing:{},desire:'unknown',notes:'',status:'draft',selected:false};db.entries.unshift(it);db.active=it.id;db.step=0;db.tab='wizard';save();render();}
function removeEntry(id){if(!confirm('确定删除这部作品及其评分吗？'))return;db.entries=db.entries.filter(x=>x.id!==id);if(db.active===id)db.active=null;save();render();}
function setTab(tab){db.tab=tab;save();render();}
function edit(id){db.active=id;db.tab='wizard';db.step=0;save();render();}
function scoreOf(it,dimension){let sum=0,covered=0;const metrics=dimension==='timing'?TIMING:METRICS;const vals=dimension==='timing'?it.timing:it.rating;metrics.forEach(m=>{if(vals[m[0]]!==undefined&&vals[m[0]]!==null&&vals[m[0]]!==''){sum+=m[2]*Number(vals[m[0]])/4;covered+=m[2];}});return {value:covered?Math.max(0,Math.min(100,Math.round(50+sum*100/covered))):null,covered:covered,complete:covered===100};}
function priceRatio(it){let p=n(it.price),o=n(it.original);return p>0&&o>0?Math.round(p/o*1000)/100:null;}
function flags(it){let veto=[],warning=[];const p=n(it.price),mins=n(it.minutes),pr=db.profile;
if(it.red==='yes')veto.push('剧情包含个人绝对雷点');
if(it.rod==='yes')veto.push('试听发现明显棒读');
if(it.dailyCheck==='no')veto.push('日常试听不喜欢');
if(it.intimateCheck==='no')veto.push('亲密试听不喜欢');
if(it.minutes!==''&&mins<pr.minMinutes)veto.push('时长低于'+pr.minMinutes+'分钟');
if(it.price!==''&&p>pr.exception)warning.push('价格超过特殊预算上限 '+yuan(pr.exception));
else if(it.price!==''&&p>pr.usual&&!it.exception)warning.push('超出常规预算，尚未确认是否破例');
if(it.red==='unknown')warning.push('剧情雷点尚未排查');
if(it.dailyCheck==='unknown'||it.intimateCheck==='unknown')warning.push('日常或亲密试听尚未完成');
if(it.rod==='unknown')warning.push('棒读情况尚未确认');
if(it.minutes==='')warning.push('作品时长尚未确认');
if(it.price==='')warning.push('实际售价尚未填写');
if(it.first==='no')warning.push('第一眼兴趣不足');
const ratio=priceRatio(it);if(ratio!==null&&ratio>pr.maxDiscount)warning.push('折扣未达到偏好的'+pr.maxDiscount+'折');

function suggestion(it){const f=flags(it),s=scoreOf(it,'rating'),t=scoreOf(it,'timing');if(f.blocked)return {label:'一票否决',klass:'bad',value:null,reason:f.veto.join('；')};if(f.warning.some(x=>x.includes('价格超过特殊')))return {label:'超过预算上限',klass:'warn',value:null,reason:'建议暂缓'};

if(!s.complete)return {label:'待评分',klass:'warn',value:null,reason:'七个维度全部评分后生成建议'};
const total=t.covered?Math.round(s.value*.85+t.value*.15):s.value;
if(s.value<70||total<65)return {label:'建议候补',klass:'warn',value:total,reason:'匹配度或综合分未达购买推荐线'};
if(total>=85)return {label:'强烈推荐',klass:'good',value:total,reason:'高匹配候选'};
if(total>=75)return {label:'推荐购买',klass:'good',value:total,reason:'可进入购物车二筛'};
return {label:'可以考虑',klass:'purple',value:total,reason:'建议与同价位候选比较'};
}

(over?'<div class="alert error">本次选购已超出设置的预算或件数，请调整清单。</div>':'<div class="alert ok">剩余 '+yuan(Math.max(0,db.profile.budget-spent))+'，剩余 '+Math.max(0,db.profile.limit-selected.length)+' 个名额。</div>')+'</div>'+
'<div class="spread"><h2>候选排名</h2><span class="muted tiny">已评分作品按综合参考分排序；可手动覆盖</span></div>'+
(candidates.length?'<div class="list">'+candidates.map((it,i)=>{const sg=suggestion(it),sc=scoreOf(it,'rating');return '<div class="item"><div class="item-main"><div class="smallcaps">RANK '+String(i+1).padStart(2,'0')+' · '+(it.desire==='high'?'特别想听':it.desire==='medium'?'比较想听':it.desire==='low'?'有点兴趣':'期待程度未填')+'</div><div class="item-title">'+e(it.title||it.rj||'未命名作品')+'</div><div class="item-meta">'+(it.price!==''?yuan(it.price):'价格未知')+' · 喜好分 '+(sc.complete?sc.value:'待评分')+' · <span class="chip '+sg.klass+'">'+sg.label+'</span></div></div><div class="row"><button class="btn small" data-action="edit" data-id="'+it.id+'">查看</button><button class="btn small '+(it.selected?'purple':'primary')+'" data-action="toggleBuy" data-id="'+it.id+'">'+(it.selected?'✓ 已选':'＋ 本次买')+'</button></div></div>';}).join('')+'</div>':'<div class="card empty"><div class="emoji">🧺</div><h3>购物车还是空的</h3><p>先完成作品评估，点击「加入候选」，再来比较。</p><button class="btn primary" data-action="new">开始评估</button></div>')+
'<div class="card" style="margin-top:16px"><h2>本次拟购清单</h2>'+(selected.length?'<ol class="summary-list">'+selected.map(it=>'<li>'+e(it.title||it.rj||'未命名')+' · '+(it.price!==''?yuan(it.price):'未填价格')+'</li>').join('')+'</ol><button class="btn small" style="margin-top:14px" data-action="copyList">复制购买清单</button>':'<p class="muted tiny">点击「本次买」后，作品就会出现在这里。</p>')+'</div>');}
function settings(){const p=db.profile;wrap(hero('偏好设置与数据备份','这是你自己的购买标准。之后换预算、换促销活动，都可以在这里修改。','⚙️')+
'<div class="grid"><section class="card"><h2>购买习惯</h2>'+
[['usual','常规单部价格上限（元）'],['exception','喜欢的作品破例上限（元）'],['cheap','觉得很划算的价格（元）'],['minMinutes','最低时长（分钟）'],['maxDiscount','偏好的最高折数（2 = 二折）'],['budget','本次总预算（元）'],['limit','本次最多购买（部）']].map(x=>'<div class="field"><label>'+x[1]+'</label><input type="number" min="0" step="any" data-profile="'+x[0]+'" value="'+e(p[x[0]])+'"></div>').join('')+
'<p class="tiny muted">这些值会影响提醒和判断，不会自动购买、删除或强制清空已选作品。</p></section>'+
'<section class="card"><h2>数据只在你的浏览器里</h2><p class="muted tiny">无需登录，也没有外部数据服务。浏览器清缓存、换设备前，请导出备份文件。</p><div class="row"><button class="btn primary" data-action="export">↓ 导出 JSON</button><button class="btn" data-action="import">↑ 导入备份</button><input class="hide" id="importFile" type="file" accept=".json,application/json"></div><div class="line"></div><h3>评分规则 V1.0</h3><p class="tiny muted">喜好分：从50分起算，七个维度按 -2 至 +2 加减。时机分独立计算，已有时机信息时参考总分=喜好×85%+时机×15%。一票否决始终优先。</p><div class="alert">当前模型为第一次测试。评分阈值和权重未来可根据实际购买体验调整。</div><div class="line"></div><button class="btn danger small" data-action="clearAll">清空所有作品和记录</button></section></div>');}
function render(){if(db.tab==='wizard')wizard();else if(db.tab==='library')library();else if(db.tab==='cart')cart();else if(db.tab==='settings')settings();else home();}
document.addEventListener('input',ev=>{const t=ev.target,it=entry();if(t.dataset.field&&it){it[t.dataset.field]=t.value;save();}
if(t.dataset.profile){db.profile[t.dataset.profile]=n(t.value);save();}
});
document.addEventListener('change',ev=>{const t=ev.target,it=entry();if(t.dataset.checkfield&&it){it[t.dataset.checkfield]=t.checked;save();}
if(t.dataset.field||t.dataset.profile)render();
if(t.id==='importFile'&&t.files[0]){const r=new FileReader();r.onload=function(){try{const x=JSON.parse(r.result);if(!x||!Array.isArray(x.entries)||!x.profile)throw Error('invalid');if(!confirm('导入将替换当前所有作品及设置。确认继续？'))return;db=Object.assign({},JSON.parse(JSON.stringify(DEFAULT)),x,{profile:Object.assign({},DEFAULT.profile,x.profile)});db.tab='home';db.active=null;db.step=0;save();render();}catch(err){alert('备份格式无效，请选择本工具导出的JSON文件。');}};r.readAsText(t.files[0]);}
});
document.addEventListener('click',ev=>{const btn=ev.target.closest('button');if(!btn)return;const it=entry(),d=btn.dataset;
if(d.tab){setTab(d.tab);return;}
if(d.choice&&it){it[d.choice]=d.value;save();render();return;}
if(d.rate&&it){it[d.rate][d.metric]=Number(d.value);save();render();return;}
switch(d.action){
case 'fetchRJ':if(it)fetchRJ(it);break;
case 'new':newEntry();break;
case 'edit':edit(d.id);break;
case 'delete':removeEntry(d.id);break;
case 'prev':db.step=Math.max(0,db.step-1);save();render();window.scrollTo({top:0,behavior:'smooth'});break;
case 'next':db.step=Math.min(4,db.step+1);save();render();window.scrollTo({top:0,behavior:'smooth'});break;
case 'holdNow':db.tab='library';save();render();break;
case 'status':{let target=db.entries.find(x=>x.id===d.id);if(target){target.status=d.value;if(d.value!=='candidate')target.selected=false;save();render();}break;}
case 'finish':if(it){it.status=d.value;if(d.value!=='candidate')it.selected=false;db.tab=d.value==='candidate'?'cart':'library';save();render();window.scrollTo({top:0,behavior:'smooth'});}break;
case 'toggleBuy':{let target=db.entries.find(x=>x.id===d.id);if(target){target.selected=!target.selected;if(target.selected)target.status='candidate';save();render();}break;}
case 'export':{const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='抓抓挑选器备份-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);break;}
case 'import':document.getElementById('importFile').click();break;
case 'clearAll':if(confirm('这将删除全部作品评分和购物清单，确定清空？')){db.entries=[];db.active=null;db.tab='home';save();render();}break;
case 'copyList':{let items=db.entries.filter(x=>x.selected);let text='本次乙抓购物清单\n'+items.map((x,i)=>(i+1)+'. '+(x.title||x.rj||'未命名')+' '+(x.rj||'')+' '+(x.price!==''?yuan(x.price):'待补价')).join('\n')+'\n合计：'+yuan(items.reduce((a,b)=>a+n(b.price),0));if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(()=>alert('已复制清单')).catch(()=>window.prompt('复制清单：',text));}else window.prompt('复制清单：',text);break;}
}
});
render();
})();
</script>
</body>
</html>
